name: TQQQ 200MA alert

on:
  schedule:
    # 미국 정규장 마감 후 (평일 21:30 UTC = 한국 06:30 / 서머타임 해제 후에도 마감 이후)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "조건과 무관하게 현재 상태 전송 (테스트)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tqqq_alert.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_NOTIFY: ${{ inputs.force_notify && '1' || '0' }}
